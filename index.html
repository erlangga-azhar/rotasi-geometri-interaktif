<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RotasiLab — aplikasi edukasi interaktif rotasi (perputaran) pada transformasi geometri untuk SMA/SMK. Visualizer Kartesius, matriks dinamis, kalkulator step-by-step, dan kuis. Dapat digunakan offline."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>RotasiLab — Rotasi (Perputaran) Transformasi Geometri</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rotasi-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* preferensi tema tidak tersedia */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui">
        Aplikasi ini membutuhkan JavaScript. Silakan aktifkan JavaScript pada browser Anda.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
