<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RotasiLab — aplikasi edukasi interaktif rotasi (perputaran) pada transformasi geometri untuk SMA/SMK. Visualizer Kartesius, matriks dinamis, kalkulator step-by-step, dan kuis. Dapat digunakan offline."
    />
    <meta name="theme-color" content="#f8fafc" id="theme-color" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>RotasiLab — Rotasi (Perputaran) Transformasi Geometri</title>
    <script>
      /* Terapkan tema sebelum paint agar tidak ada kilatan latar yang salah. */
      (function () {
        try {
          var stored = localStorage.getItem('rotasi-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById('theme-color');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#020617' : '#f8fafc');
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <style>
        .noscript {
          padding: 24px;
          font-family: system-ui, sans-serif;
          background: #f8fafc;
          color: #0f172a;
        }
        @media (prefers-color-scheme: dark) {
          .noscript {
            background: #020617;
            color: #f1f5f9;
          }
        }
      </style>
      <div class="noscript">Aplikasi ini membutuhkan JavaScript. Silakan aktifkan JavaScript pada browser Anda.</div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
